# Production config for the AIRS Forward Stream (FS) stores: TROPESS
# AIRS-Aqua HDO Level 2, collection version 1, Standard and Summary merged.
#
# docs/products/tropess.md holds every decision this encodes (Product scheme,
# the AIRS v1 production subset P1-P8, issues R1-R32). In short:
# - one product per stream and collection version, named
#   wisosat.airs.v_1.fs... (version + version_product);
# - each day's Standard and Summary files merged onto the Standard rows;
# - x of the first row of every Standard file masked as a declared defect;
# - the source row order kept: TROPESS files are not in time order.
product: airs
source: tropess
directories:
  raw: /glade/derecho/scratch/kheyblom/data/wisosat/raw/AIRS
  zarr: /glade/derecho/scratch/kheyblom/data/wisosat/zarr/airs
  logs: ./logs
output_conventions:
  filename: 'wisosat.{product}.{version}.{frequency}.{grid_name}.{variable}.zarr'
log_file: wisosat_zarr_airs_fs.log
# the collection version every file declares (VersionID), checked on every file
version: '1'
# the stream, after the version in the store names; it also selects the
# stream's collection folders under the raw root (LISTING_OPTIONS)
version_product: fs
# the files' Platform attribute, checked on every file
platform: Aqua
temporal_resolution: observation
grid_name: native_swath
# the style guide's exception: rows kept in source order, which is not time
# order (R32, user decision 2026-10-23)
time_order: source

# canonical names, each a row of nomenclature-key_tropess.md (P3, approved
# 2026-10-23). TROPESS publishes no quality flag.
variables:
  - water_vapor_hdo_h2o_ratio
  - water_vapor_h2o_mole_fraction_dry_air
  - water_vapor_delta_d_850_250hpa
  - water_vapor_delta_d_850_250hpa_standard_error
  - water_vapor_h2o_mole_fraction_dry_air_850_250hpa
  - water_vapor_h2o_mole_fraction_dry_air_850_250hpa_standard_error
  - water_vapor_delta_d_004
  - water_vapor_hdo_h2o_ratio_degrees_of_freedom_for_signal
  - cloud_effective_optical_depth
  - cloud_top_pressure
  - temperature_surface
  - land_flag
  - day_night_flag
  - water_vapor_hdo_h2o_ratio_apriori
  - water_vapor_hdo_h2o_ratio_averaging_kernel_log
  - water_vapor_h2o_mole_fraction_dry_air_observation_standard_error_log
  - pressure
  - altitude

# days upstream has only one of the two files (R23; Q1: every row kept).
# The listing fails on any other one-sided day
expected_partial_granules:
  '20210212': Standard
  '20220619': Summary
  '20221106': Summary

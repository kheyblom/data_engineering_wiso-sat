# Rows that are not observations (no time, latitude or longitude written) are
# left out by the shared rule (RowRule in utils/granules.py, 2026-10-17). None
# is known in FOCAL, so nothing may be written on one.
allowed_on_rows_left_out: []

# FOCAL declares no fill and the sampled files hold none: they publish only
# soundings that passed quality control. The verifier fails if a netCDF default
# fill turns up anywhere.
source_fill_values: {}

# What an integer variable holds at a sounding its file does not have (the
# merge). -2147483647, the netCDF default int fill, is never written by FOCAL
# (flags are 0 or 1), and the verifier confirms that over the whole record.
absent_fill_values:
  xded_quality_flag: -2147483647
  xh2o_quality_flag: -2147483647

# Scale settings (design condition 3). The whole record is ~7e6 soundings
# (~28 MB per float32 store), so one chunk would hold the lot; 1,048,576 obs
# is 4 MiB of float32 and 8 MiB of int64 time, near the guide's 5-40 MiB
# floor while keeping several chunks for partial reads. The (obs, layer) and
# (obs, level) arrays take 20 and 24 MiB at the same length, so no halving.
chunks:
  obs: 1048576
  granule: 8192
granules_per_commit: 365
num_workers: 4

filtering_guidance: >-
  FOCAL v3.0 files hold only soundings that passed IUP's multi-stage
  product-level quality control (Sarkar et al. 2026), and every flag sampled is
  0 (good). No further filtering is recommended upstream.

attrs:
  title: >-
    WISO-SAT GOSAT Level 2 (IUP FOCAL {version_label}): {variable}
  summary: >-
    One variable of the IUP FOCAL GOSAT delta D and XH2O retrievals as
    distributed for WISO-SAT, every sounding of the record, stored as an
    icechunk-backed zarr store. Each day's DED and H2O files are merged onto
    one obs axis of distinct soundings. Join with the geolocation store of the
    same product on obs for time, latitude and longitude, and with the
    pressure store for the pressure levels.
  Conventions: ACDD-1.3
  source: >-
    IUP FOCAL GOSAT Level 2 product {version_label}, one DED and one H2O
    netCDF file per day, University of Bremen
  institution: Institute of Environmental Physics (IUP), University of Bremen (source data)
  creator_name: Kyle Heyblom
  creator_email: heyblom@umich.edu
  # Sarkar et al. checked 2026-10-14 against its DOI record (no volume or
  # article number yet)
  references: >-
    Sarkar, M., Dee, S., Frazer, M., Bailey, A., Good, S., et al. (2026), WISO-SAT:
    A global database of stable hydrogen isotopes in water vapor from eight
    satellite missions, Scientific Data, doi:10.1038/s41597-026-08218-8. FOCAL Product
    Specification Document Version 3, www.esa-ghg-cci.org.
  related_store: >-
    wisosat.{product}.{version}.{frequency}.{grid_name}.geolocation.zarr holds
    time, lat and lon for every obs, and
    wisosat.{product}.{version}.{frequency}.{grid_name}.pressure.zarr the 6
    pressure levels bounding the 5 layers, surface first; every store of this
    product shares one obs axis and granule index.
  granule: >-
    one day; granule_id is the date, and granule_file names the day's DED and
    H2O files
  known_data_gaps: >-
    138 days between 2009-04-23 and 2021-12-31 have no files upstream; they are
    listed in the build config (expected_missing_days).

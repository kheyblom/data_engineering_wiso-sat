# Production config for the GOSAT (IUP FOCAL v3.0.1) stores.
#
# One run builds the geolocation store plus one store per variable listed, in
# a single pass over the days. Each day's DED and H2O files are merged onto one
# obs axis (decided 2026-10-14; see products/gosat.py). NOT YET RUN: GOSAT is
# the second reader of design condition 1, built at fixture level.
product: gosat
directories:
  raw: /glade/derecho/scratch/kheyblom/data/wisosat/raw/GOSAT
  zarr: /glade/derecho/scratch/kheyblom/data/wisosat/zarr/gosat
  logs: ./logs
output_conventions:
  filename: 'wisosat.{product}.{version}.{frequency}.{grid_name}.{variable}.zarr'
log_file: wisosat_zarr_gosat.log
# the files' root product_version attribute, checked on every file
version: 'v3.0.1'
temporal_resolution: observation
grid_name: native_swath

# canonical names, each a row of nomenclature-key_gosat.md; both quality flags
# are mandatory
variables:
  - water_vapor_column_delta_d
  - water_vapor_column_delta_d_standard_error
  - quality_flags_retrieval_delta_d
  - water_vapor_column_h2o_mole_fraction_dry_air
  - water_vapor_column_h2o_mole_fraction_dry_air_standard_error
  - quality_flags_retrieval_h2o
  - solar_zenith_angle
  - water_vapor_column_h2o_mole_fraction_dry_air_averaging_kernel
  - water_vapor_h2o_mole_fraction_dry_air_apriori
  - pressure_weight_column_average
  - pressure

# days between the first and last file with no files of either kind (listed
# 2026-10-14). The build fails on any other gap.

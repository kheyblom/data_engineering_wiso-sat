# Orbit files corrupt upstream: byte-identical to the server copies and
# unreadable by HDF5 (audit of every file, 2026-10-16). Left out of every store;
# the build confirms each still fails to open, and refuses any other unreadable
# file.
expected_unreadable_granules:
  - '03335'  # 2018-06-05, wrong fractal heap header signature
  - '07821'  # 2019-04-17, truncated (3.6 MB of 645 MB)
  - '07844'  # 2019-04-19, truncated (18 MB of 1.2 GB)

# Rows that are not observations are left out of every store (RowRule in
# utils/granules.py): a row needs its time, latitude and longitude all written
# (user decisions 2026-10-16 and 2026-10-17). A row left out may hold values
# only in the sources listed here; anything else written on it fails the build
# and the verification. Six rows (orbits 8480, 8674 and 8726, June 2019) carry
# a time and SRON's viewing geometry but no position or retrieval; solar
# zenith angle is the only stored source they hold (TESTING.md finding 10).
allowed_on_rows_left_out:
  - instrument/solar_zenith_angle

# Fill the files use without declaring it: SRON sets no _FillValue, so missing
# values are the netCDF default fills. Declared per source, and only where they
# occur (measured in orbit 13847): the verifier fails if a declared value never
# occurs over the record, and if a netCDF default fill turns up in a source not
# listed here. Floats are masked to NaN; integers keep the value and declare it
# as _FillValue.
#
# processing_quality_flags: SRON wrote no flags in some partially processed
# orbits, so 238 processed rows (all in partial files, audit 2026-10-16) read
# the int fill. Rows that are not observations are left out, not masked.
source_fill_values:
  target_product/deltad: [9.96921e+36]
  target_product/deltad_precision: [9.96921e+36]
  target_product/h2o_column: [9.96921e+36]
  target_product/h2o_column_precision: [9.96921e+36]
  target_product/hdo_column: [9.96921e+36]
  target_product/hdo_column_precision: [9.96921e+36]
  diagnostics/processing_quality_flags: [-2147483647]
  diagnostics/iterations: [-2147483647]
  side_product/aerosol_optical_thickness: [9.96921e+36]
  side_product/aerosol_height: [9.96921e+36]
  side_product/surface_albedo: [9.96921e+36]
  diagnostics/chi_squared: [9.96921e+36]
  diagnostics/chi_squared_prefit: [9.96921e+36]
  diagnostics/number_of_spectral_points_in_retrieval: [-2147483647]
  diagnostics/number_of_spectral_points_in_prefit: [-2147483647]
  # unwritten on a few kept rows of partial files: scanline 111, ground pixel
  # 157, corners 7 (lat) and 9 (lon), all among the 83 granules with rows left
  # out (checked 2026-10-18)
  instrument/scanline: [-2147483647]
  instrument/ground_pixel: [-2147483647]
  instrument/latitude_corners: [9.96921e+36]
  instrument/longitude_corners: [9.96921e+36]
  # model comparison (checked 2026-10-19), always whole rows: the kernels
  # wherever the retrieval wrote nothing (~29% of rows in a complete orbit);
  # the priors, dry air and pressure only on kept rows of partial files (158,
  # 161, 68 and 48 rows), never in the complete orbits sampled
  target_product/h2o_column_averaging_kernel: [9.96921e+36]
  target_product/hdo_column_averaging_kernel: [9.96921e+36]
  target_product/h2o_profile_apriori: [9.96921e+36]
  target_product/hdo_profile_apriori: [9.96921e+36]
  meteo/dry_air_subcolumns: [9.96921e+36]
  meteo/pressure_levels: [9.96921e+36]

# Lossless blosc (zstd level 5, byte shuffle) for the 50- and 51-wide arrays:
# ~19 TiB against ~29 TiB with zarr's default zstd, which every other array
# keeps (two orbits measured 2026-10-19; user decision 2026-10-19). Level 9
# saves ~3% more but writes at 15-40 MiB/s.
#
# shard_obs packs their 131,072-obs chunks 32 to a file: ~7,800 files per
# array, as a 1-D array has, rather than ~249,000 in one directory (user
# decision 2026-10-19). It equals chunks.obs, so shard edges are the 1-D
# stores' chunk edges. finalize --expire reclaims the shards each commit
# supersedes (~2.5 / granules_per_commit of the bytes).
compression:
  blosc: {cname: zstd, clevel: 5, shuffle: shuffle}
  shard_obs: 4194304
  arrays:
    - water_vapor_column_h2o_averaging_kernel
    - water_vapor_column_hdo_averaging_kernel
    - water_vapor_partial_column_h2o_apriori
    - water_vapor_partial_column_hdo_apriori
    - dry_air_partial_column
    - pressure

# Scale settings (design condition 3: per product, never in code). Set with the
# user 2026-10-16 from the Tier 2 bench (TESTING.md), which ran at 20 granules
# per commit:
# - obs: 4,194,304 is 16 MiB of float32 and 32 MiB of int64 time, inside the
#   guide's 5-40 MiB; ~11 MiB stored per float32 chunk. One chunk spans ~4.7
#   orbits.
# - granule: the whole 38,648-entry index in one chunk.
# - granules_per_commit: 60, i.e. ~645 commits over the record rather than
#   ~1,930. Every commit rewrites the index and the tail chunk and keeps one
#   manifest per array, so this keeps each store's object count down. The
#   main process peaked at 2.93 GiB at 20 (two batches in flight), so ~9 GiB
#   is expected here; a batch is also what a walltime kill can lose (~30 s).
# - num_workers: 8 read processes. HDF5 is not thread safe, so reads are spread
#   over processes, never threads. The build is write-bound in the main
#   process, so more workers buy at most ~1/3 of its time.
chunks:
  obs: 4194304
  granule: 65536
granules_per_commit: 60
num_workers: 8

# The upstream filtering guidance recorded in every store's quality_filtering
# attribute. Recorded, never applied: every observation is kept.
filtering_guidance: >-
  Schneider et al. (2022), Table 1. All scenes: iterations <= 10; reduced
  chi-squared of the final fit <= 150; reduced chi-squared of the pre-fit <=
  150; solar zenith angle <= 70 degrees. Clear sky: cloud optical thickness <
  0.3 and surface albedo >= 0.02. Cloudy scenes: cloud height <= 2000 m and
  cloud optical thickness > 0.3. Clear-sky and low-cloud scenes are
  recommended; Sarkar et al. (2026) apply the all-scene and clear-sky rows.
  Cloud optical thickness and height are optical_thickness_scattering_layer
  and height_scattering_layer (SRON's effective scattering layer). Reduced
  chi-squared is inferred as chi_squared_retrieval /
  spectral_point_count_retrieval (and the prefit pair); no source defines it.
  processing_quality_flags == 0 alone still passes unphysical delta D, so
  apply the filters above as well.

# Global attributes, identical in every store of the product except where they
# template {variable}. Coverage, history, date_created and verification are
# deliberately absent: finalize_wisosat_zarr.py --attrs writes them once the
# verifier has passed.
attrs:
  title: >-
    WISO-SAT TROPOMI HDO Level 2 (SRON, processor {version_label}): {variable}
  summary: >-
    One variable of the SRON TROPOMI HDO/H2O total column retrieval
    (Schneider et al. 2022) as distributed for WISO-SAT, every observation of
    the record on the native swath, stored as an icechunk-backed zarr store.
    Join with the geolocation store of the same product on obs for time,
    latitude and longitude.
  Conventions: ACDD-1.3
  source: >-
    SRON S5P L2 HDO product {version_label} (product version 0003), one netCDF
    file per orbit, from tropomi.grid.surfsara.nl
  source_product_version: '0003'
  institution: SRON Netherlands Institute for Space Research (source data)
  creator_name: Kyle Heyblom
  creator_email: heyblom@umich.edu
  # both checked 2026-10-14 against their DOI records (Sarkar et al. has no
  # volume or article number yet)
  references: >-
    Schneider, A., Borsdorff, T., aan de Brugh, J., Lorente, A., Aemisegger,
    F., Noone, D., Henze, D., Kivi, R., and Landgraf, J. (2022), Retrieving
    H2O/HDO columns over cloudy and clear-sky scenes from the Tropospheric
    Monitoring Instrument (TROPOMI), Atmos. Meas. Tech., 15, 2251-2275,
    doi:10.5194/amt-15-2251-2022. Sarkar, M., Dee, S., Frazer, M., Bailey, A., Good, S., et al. (2026), WISO-SAT:
    A global database of stable hydrogen isotopes in water vapor from eight
    satellite missions, Scientific Data, doi:10.1038/s41597-026-08218-8.
  related_store: >-
    wisosat.{product}.{version}.{frequency}.{grid_name}.geolocation.zarr holds
    time, lat and lon for every obs; every other store of this product shares
    its obs axis and granule index.
  granule: one orbit file; granule_id is the orbit number
  known_data_gaps: >-
    77 days between 2017-11-08 and 2025-11-29 have no orbit files upstream,
    353 orbits have an empty directory upstream, and orbits 3335, 7821 and
    7844 are corrupt upstream and left out; all are listed in the build config
    (expected_missing_days, expected_empty_granules,
    expected_unreadable_granules). 109 orbit files hold no observations (the
    producer wrote nothing). Rows that are not observations, with no time,
    latitude or longitude written, are left out: the rows SRON never
    processed, and six rows in orbits 8480, 8674 and 8726 that carry a time
    and viewing geometry but no position or retrieval, so those three orbits
    hold no observations either. granule_source_rows in the granule index
    records each file's own row count. Not every orbit number has a file.

variable_attrs:
  quality_flags_retrieval:
    comment: >-
      Mandatory. SRON's processing quality flags, with their CF flag_masks,
      flag_values and flag_meanings as published. 0 is success. The
      'quality_flag' and 'convergence' variables in the source are not
      implemented and are not stored.
  chi_squared_retrieval:
    comment: >-
      Unreduced. Reduced chi-squared is inferred as this divided by
      spectral_point_count_retrieval.
  chi_squared_prefit:
    comment: >-
      Unreduced. Reduced chi-squared is inferred as this divided by
      spectral_point_count_prefit.

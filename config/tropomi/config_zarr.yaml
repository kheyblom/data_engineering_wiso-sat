# Fill the files use without declaring it: SRON sets no _FillValue, so missing
# values are the netCDF default fills. Declared per source, and only where they
# occur (measured in orbit 13847): the verifier fails if a declared value never
# occurs over the record, and if a netCDF default fill turns up in a source not
# listed here. Floats are masked to NaN; integers keep the value and declare it
# as _FillValue.
source_fill_values:
  target_product/deltad: [9.96921e+36]
  target_product/deltad_precision: [9.96921e+36]
  target_product/h2o_column: [9.96921e+36]
  target_product/h2o_column_precision: [9.96921e+36]
  target_product/hdo_column: [9.96921e+36]
  target_product/hdo_column_precision: [9.96921e+36]
  diagnostics/iterations: [-2147483647]
  side_product/aerosol_optical_thickness: [9.96921e+36]
  side_product/aerosol_height: [9.96921e+36]
  side_product/surface_albedo: [9.96921e+36]
  diagnostics/chi_squared: [9.96921e+36]
  diagnostics/chi_squared_prefit: [9.96921e+36]
  diagnostics/number_of_spectral_points_in_retrieval: [-2147483647]
  diagnostics/number_of_spectral_points_in_prefit: [-2147483647]

# Scale settings (design condition 3: per product, never in code). Starting
# points only, to be measured by the bench:
# - obs: 4,194,304 is 16 MiB of float32 and 32 MiB of int64 time, inside the
#   guide's 5-40 MiB. One chunk spans ~4.7 orbits.
# - granule: the whole ~31.5k-entry index in one chunk.
# - granules_per_commit: ~1.5 GB of reads per batch at 16 variables; a batch
#   is also what a walltime kill can lose.
# - num_workers: read processes. HDF5 is not thread safe, so reads are spread
#   over processes, never threads.
chunks:
  obs: 4194304
  granule: 65536
granules_per_commit: 20
num_workers: 8

# The upstream filtering guidance recorded in every store's quality_filtering
# attribute. Recorded, never applied: every observation is kept.
filtering_guidance: >-
  Schneider et al. (2022), Table 1. All scenes: iterations <= 10; reduced
  chi-squared of the final fit <= 150; reduced chi-squared of the pre-fit <=
  150; solar zenith angle <= 70 degrees. Clear sky: cloud optical thickness <
  0.3 and surface albedo >= 0.02. Cloudy scenes: cloud height <= 2000 m and
  cloud optical thickness > 0.3. Clear-sky and low-cloud scenes are
  recommended; Sarkar et al. (2026) apply the all-scene and clear-sky rows.
  Cloud optical thickness and height are optical_thickness_scattering_layer
  and height_scattering_layer (SRON's effective scattering layer). Reduced
  chi-squared is inferred as chi_squared_retrieval /
  spectral_point_count_retrieval (and the prefit pair); no source defines it.
  processing_quality_flags == 0 alone still passes unphysical delta D, so
  apply the filters above as well.

# Global attributes, identical in every store of the product except where they
# template {variable}. Coverage, history, date_created and verification are
# deliberately absent: finalize_wisosat_zarr.py --attrs writes them once the
# verifier has passed.
attrs:
  title: >-
    WISO-SAT TROPOMI HDO Level 2 (SRON, processor {version_label}): {variable}
  summary: >-
    One variable of the SRON TROPOMI HDO/H2O total column retrieval
    (Schneider et al. 2022) as distributed for WISO-SAT, every observation of
    the record on the native swath, stored as an icechunk-backed zarr store.
    Join with the geolocation store of the same product on obs for time,
    latitude and longitude.
  Conventions: ACDD-1.3
  source: >-
    SRON S5P L2 HDO product {version_label} (product version 0003), one netCDF
    file per orbit, from tropomi.grid.surfsara.nl
  source_product_version: '0003'
  institution: SRON Netherlands Institute for Space Research (source data)
  creator_name: Kyle Heyblom
  creator_email: heyblom@umich.edu
  # both checked 2026-10-14 against their DOI records (Sarkar et al. has no
  # volume or article number yet)
  references: >-
    Schneider, A., Borsdorff, T., aan de Brugh, J., Lorente, A., Aemisegger,
    F., Noone, D., Henze, D., Kivi, R., and Landgraf, J. (2022), Retrieving
    H2O/HDO columns over cloudy and clear-sky scenes from the Tropospheric
    Monitoring Instrument (TROPOMI), Atmos. Meas. Tech., 15, 2251-2275,
    doi:10.5194/amt-15-2251-2022. Sarkar, M., Dee, S., Frazer, M., Bailey, A., Good, S., et al. (2026), WISO-SAT:
    A global database of stable hydrogen isotopes in water vapor from eight
    satellite missions, Scientific Data, doi:10.1038/s41597-026-08218-8.
  related_store: >-
    wisosat.{product}.{version}.{frequency}.{grid_name}.geolocation.zarr holds
    time, lat and lon for every obs; every other store of this product shares
    its obs axis and granule index.
  granule: one orbit file; granule_id is the orbit number
  known_data_gaps: >-
    70 days between 2017-11-08 and 2024-05-30 have no orbit files upstream;
    they are listed in the build config (expected_missing_days). Not every
    orbit number has a file.

variable_attrs:
  quality_flags_retrieval:
    comment: >-
      Mandatory. SRON's processing quality flags, with their CF flag_masks,
      flag_values and flag_meanings as published. 0 is success. The
      'quality_flag' and 'convergence' variables in the source are not
      implemented and are not stored.
  chi_squared_retrieval:
    comment: >-
      Unreduced. Reduced chi-squared is inferred as this divided by
      spectral_point_count_retrieval.
  chi_squared_prefit:
    comment: >-
      Unreduced. Reduced chi-squared is inferred as this divided by
      spectral_point_count_prefit.

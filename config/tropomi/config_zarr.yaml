# Production config for the TROPOMI (SRON HDO L2, processor 8.1) stores.
#
# One run builds the geolocation store plus one store per variable listed, in a
# single pass over the orbits. NOT YET RUN. Its scale settings come from the
# Tier 2 bench (TESTING.md); the Tier 3 job chain is planned there.
product: tropomi
directories:
  raw: /glade/derecho/scratch/kheyblom/data/wisosat/raw/TROPOMI/tropomi.grid.surfsara.nl/hdo
  zarr: /glade/derecho/scratch/kheyblom/data/wisosat/zarr/tropomi
  logs: ./logs
output_conventions:
  # <data_source>.<version>.<frequency>.<grid_name>.<variable>.zarr, with the
  # data source wisosat.<product> and no product token (decided 2026-10-14)
  filename: 'wisosat.{product}.{version}.{frequency}.{grid_name}.{variable}.zarr'
log_file: wisosat_zarr_tropomi.log
# The processor version, the root 'version' attribute of every orbit file.
# Declared so the stores can be named before a file is opened; the build and
# the verifier check every orbit against it. The '0003' in the file names is the
# product version and does not name the stores.
version: '8.1'
temporal_resolution: observation
grid_name: native_swath

# Canonical names; each needs a row in nomenclature-key_tropomi.md. The
# geolocation store is always built. quality_flags_retrieval is mandatory: the
# style guide requires quality flags in every production run.
variables:
  # core: the retrieval and its flag
  - water_vapor_column_delta_d
  - water_vapor_column_delta_d_standard_error
  - water_vapor_column_h2o
  - water_vapor_column_h2o_standard_error
  - water_vapor_column_hdo
  - water_vapor_column_hdo_standard_error
  - quality_flags_retrieval
  # every input to the Schneider et al. (2022) Table 1 filters
  - iterations_retrieval
  - solar_zenith_angle
  - optical_thickness_scattering_layer
  - height_scattering_layer
  - albedo_surface_2365nm
  - chi_squared_retrieval
  - chi_squared_prefit
  - spectral_point_count_retrieval
  - spectral_point_count_prefit
  # the pixel's address on the Level 1B grid (user decision 2026-10-18)
  - scanline_index
  - ground_pixel_index
  # model comparison, on layer (named 2026-10-19), and pressure on level, its
  # own store rather than part of geolocation (user decision 2026-10-19)
  - water_vapor_column_h2o_averaging_kernel
  - water_vapor_column_hdo_averaging_kernel
  - water_vapor_partial_column_h2o_apriori
  - water_vapor_partial_column_hdo_apriori
  - dry_air_partial_column
  - pressure


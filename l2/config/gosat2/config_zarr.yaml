# Production config for the GOSAT-2 (IUP FOCAL v3.0.1) stores.
#
# GOSAT-2 has GOSAT's file format, so it is read with the GOSAT reader and
# nomenclature key (source: gosat) while its stores are named gosat2 (user
# decision 2026-10-22). Everything else is as config/gosat/config_zarr.yaml:
# each day's DED and H2O files merged onto one obs axis, the same variables.
product: gosat2
source: gosat
directories:
  raw: /glade/derecho/scratch/kheyblom/data/wisosat/raw/GOSAT-2
  zarr: /glade/derecho/scratch/kheyblom/data/wisosat/zarr/gosat2
  logs: ./logs
output_conventions:
  filename: 'wisosat.{product}.{version}.{frequency}.{grid_name}.{variable}.zarr'
log_file: wisosat_zarr_gosat2.log
# the files' root product_version attribute, checked on every file
version: 'v3.0.1'
# the files' root platform attribute, checked on every file: the product token
# names every store, and the reader also serves GOSAT
platform: GOSAT2
temporal_resolution: observation
grid_name: native_swath

# canonical names, each a row of nomenclature-key_gosat.md; both quality flags
# are mandatory
variables:
  - water_vapor_column_delta_d
  - water_vapor_column_delta_d_standard_error
  - quality_flags_retrieval_delta_d
  - water_vapor_column_h2o_mole_fraction_dry_air
  - water_vapor_column_h2o_mole_fraction_dry_air_standard_error
  - quality_flags_retrieval_h2o
  - solar_zenith_angle
  - water_vapor_column_h2o_mole_fraction_dry_air_averaging_kernel
  - water_vapor_h2o_mole_fraction_dry_air_apriori
  - pressure_weight_column_average
  - pressure

# days between the first and last file with no files of either kind (listed
# 2026-10-22; declared as found, not checked against upstream, as for GOSAT:
# user decision 2026-10-22). The build fails on any other gap.
expected_missing_days:
  - 2019-02-20
  - 2019-04-09
  - 2019-04-10
  - 2019-04-11
  - 2019-04-12
  - 2019-04-25
  - 2019-04-26
  - 2019-04-27

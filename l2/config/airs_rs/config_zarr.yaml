# every row has time, latitude and longitude (audit 2026-10-23), so none is
# left out, and nothing may be written on one that is
allowed_on_rows_left_out: []

# fill each source holds in this stream (audit 2026-10-23, TESTING.md finding
# 15); NaN is fill wherever it occurs. The verifier fails if a declared value
# never occurs, so only what occurs is declared
source_fill_values:
  x: [-999]
  x_h2o: [-999]
  pressure: [-999]
  altitude: [-999]
  observation_ops/xa: [-999]
  observation_ops/observation_error_h2o: [-999]
  geophysical/day_night_flag: [-999]
  dd_col_p_error: [-9999]

# integers whose width drifts between versions (R16), stored as one dtype
source_dtypes:
  geophysical/land_flag: int32
  geophysical/day_night_flag: int32

# R22, decided by the user 2026-10-23: masked as a declared defect. The reader
# and the verifier each confirm, from raw, that the value equals x_test
declared_masked_values:
  - source: x
    where: first_row_of_standard_file
    equals: observation_ops/x_test
    reason: >-
      The first observation of every TROPESS Standard file holds x_test, the
      averaging kernel applied to the retrieved profile (TROPESS's check of
      the kernel convention), not the retrieved HDO/H2O profile itself; it
      differs from the retrieval by up to ~6% (docs/products/tropess.md R22).
      That one profile per day is stored as NaN; the rest of the observation
      is kept.

# blosc zstd 5 + byte shuffle on the six 2-D arrays where it beats zarr's
# default zstd (bench, TESTING.md Tier 2d; user decision 2026-10-23): the
# kernel 10%, altitude 28%, the ratio 23%, the a priori 16%, H2O 12%, its
# error 5% smaller. pressure keeps the default, which compresses it better
# (16x); so does every 1-D array. No shards: the kernel has ~1,500 chunks
compression:
  blosc: {cname: zstd, clevel: 5, shuffle: shuffle}
  arrays:
    - water_vapor_hdo_h2o_ratio_averaging_kernel_log
    - altitude
    - water_vapor_hdo_h2o_ratio
    - water_vapor_hdo_h2o_ratio_apriori
    - water_vapor_h2o_mole_fraction_dry_air
    - water_vapor_h2o_mole_fraction_dry_air_observation_standard_error_log

# scale settings (condition 3; P7). ~17.1 M obs: the 17x17 kernel takes
# 32,768-obs chunks (36 MiB), the 17-level arrays 524,288, the rest 4,194,304.
# ~2,700 obs a day, so 500 days make a ~1.3 M-obs commit
chunks:
  obs: 4194304
  granule: 8192
granules_per_commit: 500
num_workers: 8

filtering_guidance: >-
  None applied: every Standard observation is kept. Sarkar et al. (2026)
  filter the forward stream with DOF >= 1 and COD <= 0.5
  (water_vapor_hdo_h2o_ratio_degrees_of_freedom_for_signal and
  cloud_effective_optical_depth), and grid this stream from TROPESS's Summary
  product, which is exactly the Standard observations with DOF > 1.1 (measured
  on every day, 2026-10-23; TROPESS does not state it). The TROPESS User Guide
  gives "DOFS > 0.7" as a rule of thumb, and says DOF is "0.8 or larger for
  all profiles", which these files contradict (DOF reaches -0.9). The fields
  merged from Summary (the 850-250 hPa means and their errors, and delta D at
  an H2O mole fraction of 0.004) exist only where DOF > 1.1.

attrs:
  title: >-
    WISO-SAT AIRS Level 2 HDO/H2O (TROPESS reanalysis stream, collection
    {version_label}): {variable}
  summary: >-
    One variable of the NASA TROPESS AIRS-Aqua HDO/H2O retrievals of the
    reanalysis stream as distributed for WISO-SAT, every observation of the
    record, stored as an icechunk-backed zarr store. Each day's Standard and
    Summary files are merged onto the Standard observations. Join with the
    geolocation store of the same product on obs for time, latitude and
    longitude, and with the pressure store for the 17 retrieval levels.
  Conventions: ACDD-1.3
  source: >-
    NASA TROPESS AIRS-Aqua L2 Deuterated Water Vapor for Reanalysis Stream,
    Standard Product V1 (TRPSDL2HDOAIRSORS, doi:10.5067/6OAFAPOL8V43) and
    Summary Product V1 (TRPSYL2HDOAIRSORS, doi:10.5067/55XVECXA26EK), one
    netCDF file of each per day, GES DISC
  source_collection_version: >-
    {version_label} (VersionID), every file
  source_algorithm: >-
    MUSES v1.6 (R1p6), format F0p8, single-instrument (J0), every file; per
    granule in the granule index (granule_algorithm, granule_format)
  institution: NASA Jet Propulsion Laboratory, TROPESS project (source data)
  creator_name: Kyle Heyblom
  creator_email: heyblom@umich.edu
  references: >-
    Sarkar, M., Dee, S., Frazer, M., Bailey, A., Good, S., et al. (2026), WISO-SAT:
    A global database of stable hydrogen isotopes in water vapor from eight
    satellite missions, Scientific Data, doi:10.1038/s41597-026-08218-8.
    Worden, J. R., et al. (2019), Characterization and evaluation of AIRS-based
    estimates of the deuterium content of water vapor, Atmos. Meas. Tech., 12,
    2331-2339, doi:10.5194/amt-12-2331-2019. TROPESS HDO/H2O Level 2 Standard
    and Summary Product User Guides and the Reanalysis Stream README, GES DISC.
  product_merge: >-
    Each day's Standard and Summary files are merged onto the Standard
    observations: the Summary product is exactly the Standard observations with
    DOF > 1.1, in the same order and with identical values (checked on every
    day by the build and the verifier). The five Summary-only fields are placed
    on their observations by time, latitude and longitude and are NaN
    elsewhere; every other variable comes from the Standard file. Days with
    only one of the two files are read from it alone (expected_partial_granules).
  stream: >-
    Reanalysis stream (RS): the record reprocessed with one fixed algorithm.
    It samples one target per 0.7 degree box per overpass over few boxes (~2,700
    observations a day, ~110 km apart), both overpasses (about half at night).
  related_product: >-
    Continued from 2021-02-01 by the forward stream,
    wisosat.airs.v_1.fs.{frequency}.{grid_name}.<variable>.zarr, built to join
    with this one (same variables, units and dimensions). At the seam the
    sampling changes (6-10x more boxes a day, almost all daytime), the
    algorithm changes (MUSES v1.6 here; v1.11 to v1.24 there; TROPESS's
    "1.12.0 Fixed HDO error calculation" postdates v1.6), and there is no AIRS
    data 2020-04 to 2021-01. Treat a trend across the seam with care.
  related_store: >-
    wisosat.{product}.{version}.{frequency}.{grid_name}.geolocation.zarr holds
    time, lat and lon for every obs, and
    wisosat.{product}.{version}.{frequency}.{grid_name}.pressure.zarr the 17
    retrieval levels, surface first; every store of this product shares one
    obs axis and granule index.
  granule: >-
    one day; granule_id is the date, and granule_file names the day's Standard
    and Summary files, in that order. Rows keep their source order, which is
    not time order.
  known_data_gaps: >-
    61 days between 2002-08-30 and 2020-03-31 have no file upstream; they are
    listed in the build config (expected_missing_days). 2002-08-30 and -31 have
    no Summary file and 2020-03-31 no Standard file upstream.

variable_attrs:
  water_vapor_hdo_h2o_ratio:
    comment: >-
      TROPESS's bias-corrected HDO/H2O profile: the source says "HDO / H2O
      ratio (includes bias correction)". The data are bias corrected based on
      comparison with aircraft measurements (TROPESS User Guide 5.1; Herman et
      al. 2014, 2020). The uncorrected profile (retrieval/x_raw) is in the
      source files but not stored.
  water_vapor_h2o_mole_fraction_dry_air:
    # retained from the Summary files, which carry it for these same values;
    # the Standard files carry none. Set here because a store's attributes are
    # written with its first commit, which may hold no Summary file; the
    # verifier checks it equals the source's
    standard_name: dry_atmosphere_volume_mixing_ratio_of_water_vapor
    comment: >-
      TROPESS's bias-corrected H2O dry-air mole fraction profile: the source
      says "H2O only (includes bias correction)" (TROPESS User Guide 5.1). The
      uncorrected profile (retrieval/x_h2o_raw) is in the source files but not
      stored.
  water_vapor_delta_d_850_250hpa:
    comment: >-
      From the Summary file, NaN where DOF <= 1.1. TROPESS's formula (the
      source attribute): 1000 * (mean(x) / 3.11e-4 - 1), an unweighted mean of
      the HDO/H2O ratio over the retrieval levels with 250 <= p < 850 hPa
      (usually 8; 5-9 over high ground).
  water_vapor_delta_d_850_250hpa_standard_error:
    comment: >-
      From the Summary file, NaN where DOF <= 1.1. 1-sigma: (1000 + delta D)
      sqrt(M S M^T), M the equal-weight mean over the same levels and S the
      Standard observation error. TROPESS writes no value where a level in the
      range has a negative variance in S, ~70% of rows (R17).
  water_vapor_h2o_mole_fraction_dry_air_850_250hpa:
    comment: >-
      From the Summary file, NaN where DOF <= 1.1. The unweighted mean of the
      H2O profile over the retrieval levels with 250 <= p < 850 hPa.
  water_vapor_h2o_mole_fraction_dry_air_850_250hpa_standard_error:
    comment: From the Summary file, NaN where DOF <= 1.1.
  water_vapor_delta_d_004:
    comment: >-
      From the Summary file, NaN where DOF <= 1.1. TROPESS: "Deuterated water
      vapor content for water vapor volume mixing ratio of 0.004". It does not
      reproduce by interpolating the stored profiles; TROPESS computes it on
      its own grid.

# AIRS FS pipeline test fixture: four real days cut to 400 Standard rows (and
# the Summary rows that match them) by validation/stage_tropess.py. Every path
# differs from production.
# - 2022-06-19 has no Standard file upstream (declared one-sided);
# - 2022-06-20 is not staged, so the missing-day check sees a gap;
# - 2022-06-21's Standard file sits in a year folder, as the later download's;
# - the old FS folder holds an L3 and a _target file name, which are skipped.
product: airs
source: tropess
directories:
  raw: /glade/derecho/scratch/kheyblom/data/wisosat_fixture/raw/airs_fs
  zarr: /glade/derecho/scratch/kheyblom/data/wisosat_fixture/zarr/airs_fs
  logs: ./logs
output_conventions:
  filename: 'wisosat.{product}.{version}.{frequency}.{grid_name}.{variable}.zarr'
log_file: wisosat_zarr_airs_fs_fixture.log
version: '1'
version_product: fs
platform: Aqua
temporal_resolution: observation
grid_name: native_swath
time_order: source

variables:
  - water_vapor_hdo_h2o_ratio
  - water_vapor_h2o_mole_fraction_dry_air
  - water_vapor_delta_d_850_250hpa
  - water_vapor_delta_d_850_250hpa_standard_error
  - water_vapor_h2o_mole_fraction_dry_air_850_250hpa
  - water_vapor_h2o_mole_fraction_dry_air_850_250hpa_standard_error
  - water_vapor_delta_d_004
  - water_vapor_hdo_h2o_ratio_degrees_of_freedom_for_signal
  - cloud_effective_optical_depth
  - cloud_top_pressure
  - temperature_surface
  - land_flag
  - day_night_flag
  - water_vapor_hdo_h2o_ratio_apriori
  - water_vapor_hdo_h2o_ratio_averaging_kernel_log
  - water_vapor_h2o_mole_fraction_dry_air_observation_standard_error_log
  - pressure
  - altitude

expected_partial_granules:
  '20220619': Summary

expected_missing_days:
  - 2022-06-20

# Only fixture configs may build from a working tree with uncommitted changes:
# the pipeline test builds during development and its stores are throwaway.
# Every other build refuses (check_clean_tree), and the test checks that no
# other config sets this.
allow_dirty_tree: true

allowed_on_rows_left_out: []

# the fill these staged days hold (the verifier fails on a declared value
# that never occurs, so the fixture declares only these)
source_fill_values:
  x: [-999]
  x_h2o: [-999]
  pressure: [-999]
  altitude: [-999]
  observation_ops/xa: [-999]
  observation_ops/observation_error_h2o: [-999]
  x_h2o_col_p_error: [-999]
  dd_col_p_error: [-9999]
source_dtypes:
  geophysical/land_flag: int32
  geophysical/day_night_flag: int32

declared_masked_values:
  - source: x
    where: first_row_of_standard_file
    equals: observation_ops/x_test
    reason: >-
      TEST FIXTURE. The first observation of every TROPESS Standard file holds
      x_test, not the retrieved profile (docs/products/tropess.md R22).

# obs: 1000 against ~400-2,700 obs a day lands appends mid-chunk; two granules
# a commit gives several commits per store
chunks:
  obs: 1000
  granule: 3
granules_per_commit: 2
num_workers: 2

filtering_guidance: >-
  TEST FIXTURE. See config_zarr.yaml for the real guidance.

attrs:
  title: 'TEST STORE -- WISO-SAT AIRS FORWARD {version_label}, staged subset, not for use: {variable}'
  summary: A correctness fixture, NOT data. Four FS days cut to 400 Standard rows.
  Conventions: ACDD-1.3
  source: TEST FIXTURE, from the TROPESS AIRS-Aqua HDO FORWARD collection {version_label}
  comment: >-
    TEST FIXTURE built from config_zarr_fixture.yaml by
    validation/test_pipeline.py. Not data.

variable_attrs:
  water_vapor_hdo_h2o_ratio:
    comment: TEST FIXTURE attribute for {variable}, and no other store.
  water_vapor_h2o_mole_fraction_dry_air:
    # retained from the Summary files, which carry it for these same values;
    # the Standard files carry none. Set here because a store's attributes are
    # written with its first commit, which may hold no Summary file; the
    # verifier checks it equals the source's
    standard_name: dry_atmosphere_volume_mixing_ratio_of_water_vapor
  day_night_flag:
    # R33: the stager gives 20220617's Standard file the early name, as
    # upstream's Standard files before 2022-03-28 have it
    standard_name: sunlit_binary_mask

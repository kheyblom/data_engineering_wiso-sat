[build-system]
# the project is installed (editable, by uv sync) for one reason, as in
# data_engineering_gleam: so that `from utils...` and `from products...`
# resolve from validation/. Without it only the repo root works, because a
# script's own directory is what lands on sys.path.
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# the entry points stay scripts; only the two packages are installed
packages = ["utils", "products"]

[project]
name = "data_engineering_wiso-sat"
version = "0.1.0"
# capped below 3.14, carried over from data_engineering_gleam: on 3.14 numpy's
# temporary elision misfires and segfaults on `condition |= data == fill_value`
# in xarray's CF masking, which every read of a full lat/lon slab goes through.
# Same numpy, same xarray, no crash on 3.13. MSWEP reads the same code path --
# the masking is xarray's, not the dataset's -- so the cap stands here too.
requires-python = ">=3.13,<3.14"
dependencies = [
    "cartopy>=0.25.0",
    "cftime>=1.6.5",
    "dask>=2026.1.2",
    "h5netcdf>=1.8.1",
    "h5py>=3.16.0",
    "icechunk>=2.1",
    "jupyter>=1.1.1",
    "marimo>=0.25.1",
    "matplotlib>=3.11.0",
    "netcdf4>=1.7.4",
    "numpy>=2.4.2",
    "pandas>=3.0.1",
    "scipy>=1.18.1",
    "xarray>=2026.2.0",
    "zarr>=3.1.5",
]
